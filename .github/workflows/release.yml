name: Cross-platform Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS bauen und testen
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          # Alle Tags holen (auch die, die nicht im Checkout liegen).
          git fetch --tags --force --quiet || true
          highest="$(git tag --list 'v1.0.*' | sed -E 's/^v1\.0\.([0-9]+)$/\1/' | grep -E '^[0-9]+$' | sort -n | tail -n 1)"
          highest="${highest:-0}"
          next="$(( highest + 1 ))"
          echo "tag=v1.0.${next}" >> "$GITHUB_OUTPUT"
          echo "::notice::Höchste vorhandene Version: v1.0.${highest} → neues Release v1.0.${next}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Kotlin/Native-Compiler cachen
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Tests im iOS-Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --build-cache --parallel
      - name: XCFramework bauen
        run: ./gradlew :shared:assembleSharedXCFramework --build-cache
      - name: XCFramework hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework
          path: shared/build/XCFrameworks/**/Shared.xcframework
          if-no-files-found: error
          retention-days: 14
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate
      - name: iOS-App für Simulator bauen
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          xcodebuild \
            -project ios/McAffen.xcodeproj \
            -scheme McAffen \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${TAG#v}" \
            build
      - name: Simulator-App als ZIP packen
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Debug-iphonesimulator/McAffen.app \
            ios/build/McAffen-iOS-Simulator.app.zip
      - name: Simulator-App hochladen
        uses: actions/upload-artifact@v4
        with:
          name: McAffen-iOS-Simulator.app.zip
          path: ios/build/McAffen-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
      # Unsigniertes IPA für echte iPhones: AltStore oder Sideloadly signieren es
      # beim Installieren mit der eigenen Apple-ID (siehe README). Fällt dieser
      # Schritt aus, bleibt der Release trotzdem möglich.
      - name: Unsigniertes iPhone-IPA bauen
        id: ipa
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/McAffen.xcodeproj \
            -scheme McAffen \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${TAG#v}" \
            build
          mkdir -p ios/build-device/ipa/Payload
          cp -R ios/build-device/Build/Products/Release-iphoneos/McAffen.app ios/build-device/ipa/Payload/
          (cd ios/build-device/ipa && zip -qry ../McAffen-unsigned.ipa Payload)
      - name: IPA hochladen
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: McAffen-unsigned.ipa
          path: ios/build-device/McAffen-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    needs: ios
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: iOS-Simulator-App herunterladen
        uses: actions/download-artifact@v4
        with:
          name: McAffen-iOS-Simulator.app.zip
          path: dist
      - name: iPhone-IPA herunterladen (falls gebaut)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: McAffen-unsigned.ipa
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Version zählt einfach hoch: v1.0.NNN → NNN = höchste vorhandene Nummer + 1.
      # Dadurch steigt der versionCode bei jedem Release um 1 und Android nimmt
      # jedes Update über die installierte App an.
      - name: Determine release tag
        id: tag
        run: echo "tag=${{ needs.ios.outputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: Keystore aus Secret bereitstellen
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 fehlt – bitte einmalig den Workflow 'Signing-Key erzeugen' starten."
            exit 1
          fi
          mkdir -p signing
          # Das Secret kann echte oder als "\n" kopierte Zeilenumbrüche sowie
          # versehentlich mitkopierte Metadaten enthalten. Diese entfernen, bevor
          # der Inhalt dekodiert wird; keytool validiert anschließend den Keystore.
          encoded="${RELEASE_KEYSTORE_BASE64#RELEASE_KEYSTORE_BASE64=}"
          encoded="${encoded#\"}"
          encoded="${encoded%\"}"
          python3 - "$encoded" <<'PY'
          import base64
          import hashlib
          import sys

          raw = sys.argv[1]
          encoded = "".join(
              char for char in raw
              if char in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
          )
          encoded = encoded.rstrip("=")
          encoded += "=" * (-len(encoded) % 4)
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print(f"::error::RELEASE_KEYSTORE_BASE64 ist ungültig: {exc}")
              raise SystemExit(1)
          print(f"Base64-Länge: {len(raw)} Zeichen")
          print(f"Base64-SHA256: {hashlib.sha256(encoded.encode('ascii')).hexdigest()}")
          print(f"Keystore-SHA256: {hashlib.sha256(data).hexdigest()}")
          if len(data) < 1000:
              print(f"::error::Der dekodierte Keystore ist zu klein ({len(data)} Bytes).")
              raise SystemExit(1)
          with open("signing/mcaffen-release.keystore", "wb") as keystore:
              keystore.write(data)
          PY
          size="$(stat -c%s signing/mcaffen-release.keystore)"
          echo "Keystore bereitgestellt ($size Bytes)."
          if [[ "$size" -lt 1000 ]]; then
            echo "::error::Der dekodierte Keystore ist zu klein ($size Bytes) – Secret RELEASE_KEYSTORE_BASE64 prüfen."
            exit 1
          fi
          # Passwort prüfen, bevor Gradle läuft (gibt das Passwort nicht aus).
          keytool -list -keystore signing/mcaffen-release.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore-Passwort oder Alias passt nicht zum Secret."; exit 1; }

      - name: Build (signiert direkt mit dem festen Schlüssel)
        env:
          RELEASE_KEYSTORE_PATH: signing/mcaffen-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease "-PmcaffenTag=${{ steps.tag.outputs.tag }}"
      - name: Signatur prüfen
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          echo "SHA256-Zertifikat (muss bei jedem Release gleich bleiben):"
          "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" || true
          # Zielname für das Release-Asset.
          mkdir -p dist
          cp "$apk" dist/McAffen-release.apk

      - name: Compute APK checksum
        id: checksum
        run: |
          set -euo pipefail
          apk="dist/McAffen-release.apk"
          checksum="$(sha256sum "$apk" | awk '{print $1}')"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          printf 'SHA256 %s  McAffen-release.apk\n' "$checksum" \
            > "dist/McAffen-release.apk.sha256"
      # Kurze, lesbare Liste der Änderungen seit dem letzten Release – landet im
      # Release-Text und damit auch im Update-Dialog der App.
      - name: Änderungen zusammenfassen
        id: notes
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 'v1.0.*' 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            range="${previous}..HEAD"
          else
            range="HEAD"
          fi
          summary="$(git log --no-merges --pretty=format:'- %s' "$range" \
            | grep -v -i -E 'update readme|^\- Release-Version' | head -n 12 || true)"
          if [[ -z "$summary" ]]; then
            summary="- Wartungsupdate ohne inhaltliche Änderungen"
          fi
          {
            echo "summary<<MC_NOTES_EOF"
            echo "$summary"
            echo "MC_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          # Ohne das schreibt Python/Runner Umlaute als "Ã¤" in die Notes.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Was ist neu
            ${{ steps.notes.outputs.summary }}

            ---
            **Installation:** Die App lädt das Update selbst herunter und installiert es über die bestehende Version – deine Daten bleiben erhalten.
            **Prüfsumme:** `${{ steps.checksum.outputs.checksum }}` (auch als `McAffen-release.apk.sha256` dabei)
            **iPhone:** `McAffen-unsigned.ipa` mit AltStore oder Sideloadly installieren (Anleitung im README). `McAffen-iOS-Simulator.app.zip` läuft nur im Xcode-Simulator.
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          files: |
            dist/McAffen-release.apk
            dist/McAffen-release.apk.sha256
            dist/McAffen-iOS-Simulator.app.zip
            dist/McAffen-unsigned.ipa
