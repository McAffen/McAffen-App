name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Eindeutige Version aus Datum + Commit-Zähler: steigt immer monoton,
      # damit jede Release-APK den installierten versionCode übertrifft.
      # Format 1.YYMMDD.<commits>  →  z. B. v1.251118.42
      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          commits="$(git rev-list --count HEAD)"
          # Version muss bei JEDEM Lauf steigen, sonst gibt es keinen neuen
          # versionCode und Android lehnt das Update ab. Liegt der berechnete
          # Tag nicht über allen vorhandenen, wird die Patch-Nummer erhöht.
          today="$(date -u +%y%m%d)"
          # Höchsten versionCode aller vorhandenen Tags bestimmen (im eigenen Prozess,
          # damit die Schleife die Variable wirklich aktualisiert).
          highest="$(git tag --list 'v*' | python3 -c '
          import sys
          best = 0
          for line in sys.stdin:
              tag = line.strip().lstrip("v")
              parts = [p for p in tag.split(".")]
              if len(parts) < 3:
                  continue
              try:
                  major, minor, patch = (int(p) for p in parts[:3])
              except ValueError:
                  continue
              best = max(best, major * 10000000 + minor * 100000 + patch)
          print(best)
          ')"
          # Patch-Nummer = bisheriger Patch + 1 (nie zurückspringen, auch nicht
          # wenn ein alter Tag eine riesige Nummer hatte).
          patch="$(( highest % 100000 + 1 ))"
          (( patch > 99999 )) && patch=1
          candidate="v1.${today}.${patch}"
          echo "::notice::Höchster vorhandener versionCode: $highest → neuer Tag $candidate"
          echo "tag=$candidate" >> "$GITHUB_OUTPUT"
          echo "Release-Tag: $candidate (versionCode $(version_to_code "$candidate"))"
      - name: Keystore aus Secret bereitstellen
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 fehlt – bitte einmalig den Workflow 'Signing-Key erzeugen' starten."
            exit 1
          fi
          mkdir -p signing
          # Das Secret kann echte oder als "\n" kopierte Zeilenumbrüche sowie
          # versehentlich mitkopierte Metadaten enthalten. Diese entfernen, bevor
          # der Inhalt dekodiert wird; keytool validiert anschließend den Keystore.
          encoded="${RELEASE_KEYSTORE_BASE64#RELEASE_KEYSTORE_BASE64=}"
          encoded="${encoded#\"}"
          encoded="${encoded%\"}"
          python3 - "$encoded" <<'PY'
          import base64
          import hashlib
          import sys

          raw = sys.argv[1]
          encoded = "".join(
              char for char in raw
              if char in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
          )
          encoded = encoded.rstrip("=")
          encoded += "=" * (-len(encoded) % 4)
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print(f"::error::RELEASE_KEYSTORE_BASE64 ist ungültig: {exc}")
              raise SystemExit(1)
          print(f"Base64-Länge: {len(raw)} Zeichen")
          print(f"Base64-SHA256: {hashlib.sha256(encoded.encode('ascii')).hexdigest()}")
          print(f"Keystore-SHA256: {hashlib.sha256(data).hexdigest()}")
          if len(data) < 1000:
              print(f"::error::Der dekodierte Keystore ist zu klein ({len(data)} Bytes).")
              raise SystemExit(1)
          with open("signing/mcaffen-release.keystore", "wb") as keystore:
              keystore.write(data)
          PY
          size="$(stat -c%s signing/mcaffen-release.keystore)"
          echo "Keystore bereitgestellt ($size Bytes)."
          if [[ "$size" -lt 1000 ]]; then
            echo "::error::Der dekodierte Keystore ist zu klein ($size Bytes) – Secret RELEASE_KEYSTORE_BASE64 prüfen."
            exit 1
          fi
          # Passwort prüfen, bevor Gradle läuft (gibt das Passwort nicht aus).
          keytool -list -keystore signing/mcaffen-release.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore-Passwort oder Alias passt nicht zum Secret."; exit 1; }

      - name: Build (signiert direkt mit dem festen Schlüssel)
        env:
          RELEASE_KEYSTORE_PATH: signing/mcaffen-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease "-PmcaffenTag=${{ steps.tag.outputs.tag }}"
      - name: Signatur prüfen
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          echo "SHA256-Zertifikat (muss bei jedem Release gleich bleiben):"
          "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" || true
          # Zielname für das Release-Asset.
          mkdir -p dist
          cp "$apk" dist/McAffen-release.apk

      - name: Compute APK checksum
        id: checksum
        run: |
          set -euo pipefail
          apk="dist/McAffen-release.apk"
          checksum="$(sha256sum "$apk" | awk '{print $1}')"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          printf 'SHA256 %s  McAffen-release.apk\n' "$checksum" \
            > "dist/McAffen-release.apk.sha256"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Installation
            Die App aktualisiert sich selbst (In-App-Update) – ein vorheriges Deinstallieren ist **nicht** nötig.

            **Integrität prüfen (optional):**
            - `McAffen-release.apk` ↔ SHA-256: `${{ steps.checksum.outputs.checksum }}`
            - Die Prüfsummendatei hängt als `McAffen-release.apk.sha256` bei (Linux: `sha256sum -c McAffen-release.apk.sha256`).

            **Hinweis zu Google Play Protect:** Apps außerhalb des Play Stores (Download + Installer-Berechtigung) erhalten häufig automatische Warnungen – hierbei handelt es sich um eine Fehlwarnung. Bei der Installationsabfrage **„Details" → „Trotzdem installieren"** wählen; die SHA-256-Prüfsumme oben belegt die Herkunft von diesem offiziellen Repository.
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/McAffen-release.apk
            dist/McAffen-release.apk.sha256
