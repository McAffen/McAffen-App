name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    # macOS-Runner sind nötig, weil Xcode nur dort läuft.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin-Framework für iOS bauen
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: XcodeGen
        run: brew install xcodegen

      - name: Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Bauen (Simulator, ohne Signierung)
        working-directory: ios
        run: |
          xcodebuild -project McAffen.xcodeproj \
            -scheme McAffen \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Startet den Upload zu TestFlight, sobald die Signierungs-Secrets gesetzt sind.
  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_TESTFLIGHT == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: XcodeGen
        run: brew install xcodegen

      - name: Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Zertifikat und Profil installieren
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archiv bauen und zu TestFlight laden
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcodebuild -project McAffen.xcodeproj -scheme McAffen \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/McAffen.xcarchive" archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/McAffen.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/McAffen.ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
