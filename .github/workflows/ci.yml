name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Jeder Schritt einzeln: so steht im Log sofort, woran es lag.
      - name: Tests
        run: ./gradlew test --parallel --build-cache
      - name: Lint
        run: ./gradlew lint --parallel --build-cache
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --parallel --build-cache
      - name: Lint-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
